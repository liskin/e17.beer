name: Refresh hours data

on:
  workflow_dispatch:
    inputs:
      cache_evict_spreadsheet:
        description: 'Evict cache: spreadsheet'
        type: boolean
        required: false
      cache_evict_places_client_search:
        description: 'Evict cache: places_client_search'
        type: boolean
        required: false
      cache_evict_places_client_hours:
        description: 'Evict cache: places_client_hours'
        type: boolean
        required: false

  schedule:
    # Run every day at 7:30 GMT/BST
    - cron: '30 7 * * *'
      timezone: Europe/London

env:
  # avoid resolution even if exclude-newer differs
  UV_FROZEN: 1

jobs:
  refresh:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          add-problem-matchers: 'false'

      - name: Set up git user name/email
        run: |
          set -ex

          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Prepare git stuff
        run: |
          set -ex

          git remote set-head --auto origin
          git checkout -b hours-refresh

      - name: Cache (requests)
        uses: actions/cache@v6
        with:
          path: _scripts/_data/_cache/
          key: scripts-data-cache

      - name: Refresh hours data
        working-directory: _scripts
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          CACHE_EVICT: >-
            ${{ inputs.cache_evict_spreadsheet && '-E spreadsheet' || '' }}
            ${{ inputs.cache_evict_places_client_search && '-E places_client_search' || '' }}
            ${{ inputs.cache_evict_places_client_hours && '-E places_client_hours' || '' }}
        run: |
          set -ex

          just evict-irregular-hours
          just fetch-venue-metadata $CACHE_EVICT
          just update-places $CACHE_EVICT

          # commit if anything changed
          git diff --quiet --exit-code || git commit -a -m 'chore(hours): Update data'

      - name: Create pull request if anything changed
        run: |
          set -ex

          # exit if there were no changes
          git diff --quiet --exit-code origin/HEAD && exit

          # exit if there's already an hours-refresh branch with the same contents
          if git fetch origin hours-refresh; then
            git diff --quiet --exit-code FETCH_HEAD && exit
          fi

          git push -f -u origin hours-refresh:hours-refresh

          # open pull request if there isn't one already
          err=$(
            gh pr create \
              --title='chore(hours): Update data' \
              --body='(automatic PR)' \
              2>&1
          ) && ret=$? || ret=$?
          if (( ret )) && [[ "$err" != *"a pull request for branch"*"already exists:"* ]]; then
            exit $ret
          else
            printf '%s\n' "$err" >> $GITHUB_STEP_SUMMARY
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Export changes bundle
        if: |
          !cancelled()
        run: |
          git diff --quiet --exit-code origin/HEAD || git bundle create changes.bundle origin/HEAD..

      - name: Publish changes bundle as artifact
        if: |
          !cancelled()
        uses: actions/upload-artifact@v7
        with:
          path: changes.bundle

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
